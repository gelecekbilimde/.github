name: Sync Codefloe Organization Profile

on:
  push:
    branches:
      - main
    paths:
      - "profile/README.md"

  workflow_dispatch:

jobs:
  sync:
    name: Sync GitHub profile to Codefloe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub organization profile
        uses: actions/checkout@v5

      - name: Verify configuration
        env:
          CODEFLOE_TOKEN: ${{ secrets.CODEFLOE_TOKEN }}
        run: |
          if [ -z "$CODEFLOE_TOKEN" ]; then
            echo "ERROR: CODEFLOE_TOKEN is missing."
            exit 1
          fi

          if [ ! -f "profile/README.md" ]; then
            echo "ERROR: profile/README.md is missing."
            exit 1
          fi

          echo "Configuration OK."

      - name: Sync README using Codefloe API
        env:
          CODEFLOE_TOKEN: ${{ secrets.CODEFLOE_TOKEN }}
        run: |
          set -euo pipefail

          API="https://codefloe.com/api/v1"
          REPO="gelecekbilimde/.profile"
          FILE="README.md"

          echo "Getting current README information..."

          RESPONSE=$(curl --fail --silent --show-error \
            --max-time 30 \
            -H "Authorization: token ${CODEFLOE_TOKEN}" \
            -H "Accept: application/json" \
            "${API}/repos/${REPO}/contents/${FILE}")

          SHA=$(echo "$RESPONSE" | jq -r '.sha')

          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "ERROR: Could not determine current README SHA."
            exit 1
          fi

          echo "Encoding GitHub organization README..."

          CONTENT=$(base64 -w 0 profile/README.md)

          PAYLOAD=$(jq -n \
            --arg content "$CONTENT" \
            --arg sha "$SHA" \
            '{
              content: $content,
              sha: $sha,
              message: "Sync organization profile from GitHub"
            }')

          echo "Updating Codefloe organization README..."

          curl --fail --silent --show-error \
            --max-time 30 \
            -X PUT \
            -H "Authorization: token ${CODEFLOE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${API}/repos/${REPO}/contents/${FILE}"

          echo
          echo "Codefloe organization profile synchronized successfully."
