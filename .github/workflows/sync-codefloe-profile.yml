name: Sync Codefloe Organization Profile

on:
  push:
    branches:
      - main
    paths:
      - "profile/README.md"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub profile
        uses: actions/checkout@v5

      - name: Sync README to Codefloe
        env:
          CODEFLOE_USER: ${{ secrets.CODEFLOE_USER }}
          CODEFLOE_TOKEN: ${{ secrets.CODEFLOE_TOKEN }}
        run: |
          git clone "https://${CODEFLOE_USER}:${CODEFLOE_TOKEN}@codefloe.com/gelecekbilimde/.profile.git" codefloe-profile

          cp profile/README.md codefloe-profile/README.md

          cd codefloe-profile

          git config user.name "Gelecek Bilimde Sync"
          git config user.email "github-actions@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Codefloe profile is already up to date."
            exit 0
          fi

          git commit -m "Sync organization profile from GitHub"
          git push
